name: release-cli

# Builds standalone `orca` binaries for every platform and publishes them to a
# GitHub Release on this (public) repo. install.sh downloads these anonymously.
#
# Cut a release by pushing a tag:
#   git tag cli-v0.1.0 && git push origin cli-v0.1.0
#
# Bun cross-compiles all targets from a single Linux runner, so one job does it.

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. cli-v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build binaries (all targets)
        run: bun scripts/build-binary.ts

      - name: Package tarballs + checksums
        run: bash scripts/package-binaries.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Orca CLI ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist-bin/*.tar.gz
            dist-bin/SHA256SUMS
